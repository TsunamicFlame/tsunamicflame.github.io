<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>GVZ</title>
    <style>
/* --- ALL PAGES CSS --- */
/* SCREEN SIZE CONTROL */


/* TOGGLE THEME COLORS */
:root {
    --header-color: #ffffff;
    --body-color: #e9e9e9;
    --modal-color: #f1f1f1;
    --container-color: #fafafa;
    --active-area-color: #b3daff;
    --active-area-txt-color: #333333;
    --active-area-hover-color: #99ceff;
    --active-area-txt-hover-color: #004280;
    --icon-color: #4d4d4d;
    --icon-hover-color: #004280;
    --icon-bg-hover-color: #ebebeb;
    --btn-color: #e6e6e6;
    --btn-hover-color: #d9d9d9;
    --btn-text-color: #4d4d4d;
    --accord-bg-color: #f5f5f5;
    --text-regular-color: #0d0d0d;
    --text-light-color: #f1f1f1;
    --h1-6-color: #1d1d1d;
    --input-bg-color: #e7e7e7;
   
    /* MAIN COLORS */
    --main-blue: #0066db;
    --light-blue: #0077ff;
    --main-green: #1b851b;
    --light-green: #2e992e;

}
[data-theme="dark"] {
    --header-color: #3b3b3b;
    --body-color: #1f1f1f;
    --modal-color: #333333;
    --container-color: #353535;
    --active-area-color: #003566;
    --active-area-txt-color: #e6e6e6;
    --active-area-hover-color: #004280;
    --active-area-txt-hover-color: #bbdeff;
    --icon-color: #e6e6e6;
    --icon-hover-color: #bbdeff;
    --icon-bg-hover-color: #4d4d4d;
    --btn-color: #454545;
    --btn-hover-color: #4d4d4d;
    --btn-text-color: #e6e6e6;
    --accord-bg-color: #434343;
    --text-regular-color: #e6e6e6;
    --text-light-color: #e6e6e6;
    --h1-6-color: #dfdfdf;
    --input-bg-color: #464646;

    /* MAIN COLORS */
    --main-blue: #0066db;
    --light-blue: #0077ff;
    --main-green: #1b851b;
    --light-green: #2e992e;

}

/* Toggle theme icons based on class */
.light_icon { display: inline; }
.dark_icon { display: none; }
#toggle_theme_btn.dark-mode .light_icon { display: none; }
#toggle_theme_btn.dark-mode .dark_icon { display: inline; }

/* MAIN TAGS */
body {
    overflow: hidden;
    margin: 0px;
    padding: 0px;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 13px;
    background: url('https://ia801705.us.archive.org/16/items/windows-xp-bliss-wallpaper/windows-xp-bliss-4k-lu-1920x1080.jpg') no-repeat center center fixed;
    background-size: cover;
    height: 100vh;
}
.taskbar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 40px;
    background: rgba(30, 30, 30, 0.60);
    display: flex;
    align-items: center;
    padding: 0 10px;
    color: white;
    z-index: 1000;
    border-top: 1px rgba(31, 31, 31, 0.1) solid;
    box-shadow: 0px 2px 2px 0px rgba(255, 255, 255, 0.1) inset;
    justify-content: space-between;
}
#left_taskbar { display: flex; gap: 25px; }
#right_taskbar { display: flex; }
#tray { display: flex; gap: 5px;}
.clock {
  display: flex;
  flex-direction: column;
  text-align: right;
  padding: 5px 10px;
}
#time { font-size: 11px; }
#date { font-size: 11px; margin-top: 3px; }

.start-button { transition: filter 0.3s ease, transform 0.2s ease; cursor: pointer; }
.start-button:hover {
    filter: drop-shadow(0 0 10px rgba(0, 174, 255, 0.6))
            drop-shadow(0 0 20px rgba(0, 174, 255, 0.4));
    transform: scale(1.015);
}
.start-button svg { height: 35px; width: 35px; }
.start-button:hover .green { filter: drop-shadow(0 0 6px #91c300aa); }
.start-button:hover .blue { filter: drop-shadow(0 0 6px #00b4f1aa); }
.start-button:hover .orange { filter: drop-shadow(0 0 6px #f8682caa); }
.start-button:hover .yellow { filter: drop-shadow(0 0 6px #ffc300aa); }
.start-button:hover .circle { filter: drop-shadow(0 0 10px rgba(0, 174, 255, 0.5)) drop-shadow(0 0 20px rgba(0, 174, 255, 0.3)); }


/* TEXT TAGS */
p { color: var(--text-regular-color); }
h1, h2, h3, h4, h5, h6 { color: var(--h1-6-color); margin: 0px; }
hr { color: var(--btn-color); }

/* HEADER CONTROL */
.header_box {
    margin: 4px;
    background-color: var(--header-color);
    padding: 2px;
    border-radius: 4px;
    display: flex;
}
.header_item {
    color: var(--icon-color);
    padding: 4px;
    display: flex;
    width: fit-content;
}
.header_item.click:hover, .header_item.click:hover .icon {
    cursor: pointer;
    stroke: var(--icon-hover-color);
    background-color: var(--icon-bg-hover-color);
    border-radius: 4px;
    color: var(--icon-hover-color);
}

/* ICON CONTROL */
.icon {
    stroke: var(--icon-color);
    height: 15px;
    width: 15px;
    margin: 0 0;
}

/* DROPDOWN STYLE */
.dropdown_button { border: none; }
.dropdown { position: relative; display: block; }
.dropdown_content {
    display: none;
    position: absolute;
    background-color: var(--header-color);
    width: max-content;
    border-radius: 4px;
    box-shadow: 0px 2px 5px 0px rgba(0,0,0,0.1);
    padding: 2px;
    z-index: 999;
    transition: all 0.2s ease;
    white-space: nowrap;
    max-width: 30vw;
}
.dropdown_content.wide { width: 50vw; white-space: normal; }
.dropdown_content.show { display: block; top: 100%; }
.dropdown_content.drop_up { top: auto; bottom: 100%; }
.dropdown_content.drop_up.show { display: block; bottom: 100%; }
.dropdown_content.right-align { left: 0px; }
.dropdown_content.left-align { right: 0px; }
.dropdown_content.measure { visibility: hidden; display: block; position: absolute; }

    </style>
</head>
<body>
    <div class="header_box">
        <div id="toggle_theme_btn" title="Change Theme" class="header_item click">
            <svg class="light_icon icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg class="dark_icon icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        </div>
    </div>
<div id="taskbar" class="taskbar">
    <div id="left_taskbar">
        <div id="start_button" class="start-button">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="35" height="35" transform="translate(0 2)">
                <!-- Blue circular background with a linear gradient -->
                <defs>
                    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="white" stop-opacity="0.3"/>
                        <stop offset="20%" stop-color="#004164" />
                        <stop offset="50%" stop-color="#004164" />
                        <stop offset="100%" stop-color="#6bbbf7" />
                    </linearGradient>
                </defs>
            
                <!-- Main circle with glossy effect -->
                <circle class="circle" cx="100" cy="100" r="95" fill="url(#blueGradient)" />
                <ellipse cx="100" cy="70" rx="75" ry="40" fill="rgba(255, 255, 255, 0.2)" />
            
                <!-- Logo with separate classes for color glow -->
                <g transform="translate(100 100) scale(0.75) translate(-85 -80)">
                    <path class="green" d="M170 20.7c-33 13.7-49 6-63.2-3.6L90.8 73.5c14.3 9.7 31.5 17.7 63.2 3.5l16.3-56.3z" fill="#91c300"/>
                    <path class="blue" d="M63 134.2c-14.3-9.6-30-17.6-63-3.9l16.2-56.6c33-13.6 49-5.9 63.3 3.8L63 134.2z" fill="#00b4f1"/>
                    <path class="orange" d="M82.2 67.3a53.9 53.9 0 0 0-31-11.3c-8.7-.1-19.1 2.4-32.2 7.8L35.2 7.4c33.1-13.7 49-6 63.3 3.7L82.2 67.3z" fill="#f8682c"/>
                    <path class="yellow" d="M88 83c14.4 9.6 30.3 17.3 63.3 3.6L135 142.8c-33 13.7-48.9 6-63.2-3.7L88.1 83z" fill="#ffc300"/>
                </g>
            </svg>
        </div>
        <div id="file_explorer">
            File Explorer Icon
        </div>
        <div id="internet_explorer">
            IE Icon
        </div>
        <div id="media_center">
            Media Center Icon
        </div>
    </div>
    <div id="right_taskbar">
        <div id="tray">
            <div id="sound">
                sound icon
            </div>
            <div id="network">
                network icon
            </div>
        </div>
        <div id="clock" class="clock">
            <div id="time"></div>
            <div id="date"></div>
        </div>
    </div>
</div>


<script>
// Clock functionality
function updateClock() {
  const now = new Date();
  
  // Get hours, minutes, and seconds
  let hours = now.getHours();
  const minutes = String(now.getMinutes()).padStart(2, '0');
  const seconds = String(now.getSeconds()).padStart(2, '0');
  
  // Convert to 12-hour format
  const period = hours >= 12 ? 'PM' : 'AM';
  hours = hours % 12 || 12; // Convert to 12-hour format, where 0 becomes 12
  
  // Get date (month/day/year)
  const day = now.getDate();
  const month = now.getMonth() + 1; // Month is 0-indexed
  const year = now.getFullYear();
  
  // Format time and date
  const time = `${hours}:${minutes} ${period}`;
  const date = `${month}/${day}/${year}`;
  
  // Display time and date
  document.getElementById('time').innerHTML = time;
  document.getElementById('date').innerHTML = date;
}

// Update the clock every second
setInterval(updateClock, 1000);










// Toggle theme controler (desktop/mobile)
document.addEventListener("DOMContentLoaded", function () {
    const themeToggleBtn = document.getElementById("toggle_theme_btn");
    const htmlElement = document.documentElement;

    // Detect and apply stored or system theme
    const storedTheme = localStorage.getItem("theme");
    const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    const currentTheme = storedTheme ? storedTheme : (prefersDark ? "dark" : "light");

    applyTheme(currentTheme);

    // Toggle theme on button click
    themeToggleBtn.addEventListener("click", function () {
        const newTheme = htmlElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
        applyTheme(newTheme);
    });

    function applyTheme(theme) {
        htmlElement.setAttribute("data-theme", theme);
        localStorage.setItem("theme", theme);

        // Toggle theme icon
        themeToggleBtn.classList.toggle("dark-mode", theme === "dark");
    }
});

// Nav dropdown functionality (includes nested dropdowns) (desktop/mobile)
document.addEventListener("DOMContentLoaded", function () {
    const dropdowns = document.querySelectorAll(".dropdown");

    dropdowns.forEach(function (dropdown) {
        const button = dropdown.querySelector(".dropdown_button");
        const content = dropdown.querySelector(".dropdown_content");

        button.addEventListener("click", function (event) {
            event.stopPropagation();

            // Close all other dropdowns that are NOT this one or descendants of it
            document.querySelectorAll(".dropdown_content.show").forEach(function (dropdownContent) {
                if (!dropdown.contains(dropdownContent) && !dropdownContent.contains(dropdown)) {
                    dropdownContent.classList.remove("show", "drop_up", "left-align", "right-align");
                }
            });

            // Reset alignment
            content.classList.remove("left-align", "right-align", "drop_up");

            // Temporarily show to measure
            content.classList.add("measure");
            const contentHeight = content.offsetHeight;
            content.classList.remove("measure");

            const rect = button.getBoundingClientRect();
            const spaceRight = window.innerWidth - rect.right;
            const spaceBelow = window.innerHeight - rect.bottom;
            const spaceAbove = rect.top;

            // Horizontal alignment
            if (spaceRight < 165) {
                content.classList.add("left-align");
            } else {
                content.classList.add("right-align");
            }

            // Drop up if not enough room below
            if (spaceBelow < contentHeight + 10 && spaceAbove > contentHeight + 10) {
                content.classList.add("drop_up");
            }

            // Toggle show
            content.classList.toggle("show");
        });

        // Prevent closing on internal clicks
        content.addEventListener("click", function (event) {
            event.stopPropagation();
        });
    });

    // Close all dropdowns on outside click
    document.addEventListener("click", function () {
        document.querySelectorAll(".dropdown_content").forEach(function (dropdownContent) {
            dropdownContent.classList.remove("show", "drop_up", "left-align", "right-align");
        });
    });
});

// Accordion functionality (limits one open at a time) (desktop/mobile)
document.addEventListener("DOMContentLoaded", function () {
    const accordions = document.querySelectorAll(".accordion");

    accordions.forEach((accordion) => {
        accordion.addEventListener("click", function () {
            // Close all other panels
            accordions.forEach((acc) => {
                if (acc !== this) {
                    acc.classList.remove("accordion_active");
                    acc.nextElementSibling.style.maxHeight = null;
                }
            });

            // Toggle the clicked panel
            this.classList.toggle("accordion_active");
            let panel = this.nextElementSibling;
            panel.style.maxHeight = panel.style.maxHeight ? null : panel.scrollHeight + "px";
        });
    });
});

</script>
</body>
</html>
