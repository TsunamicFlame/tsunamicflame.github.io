<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Resizable Windows</title>
  <style>
    body {
      margin: 0;
      background: #008080;
      font-family: Segoe UI, sans-serif;
      overflow: hidden;
    }

    .window {
      position: absolute;
      background: #fff;
      border: 2px solid #444;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      border-radius: 4px;
      min-width: 200px;
      min-height: 150px;
    }

    .window-header {
      background: linear-gradient(#e0e0e0, #c0c0c0);
      padding: 4px 8px;
      cursor: move;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .window-title {
      font-weight: bold;
    }

    .window-controls {
      display: flex;
      gap: 4px;
    }

    .window-controls button {
      width: 20px;
      height: 20px;
      border: none;
      background: #aaa;
      border-radius: 2px;
      cursor: pointer;
    }

    .window.minimized {
      display: none;
    }

    .taskbar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 40px;
      background: #333;
      display: flex;
      align-items: center;
      padding: 0 10px;
      color: white;
    }

    .taskbar-button {
      margin-right: 8px;
      background: #555;
      border: none;
      color: white;
      padding: 5px 10px;
      cursor: pointer;
      border-radius: 2px;
    }

    /* Resize handles */
    .resize-handle {
      position: absolute;
      z-index: 10;
    }

    .resize-handle.n { top: -3px; left: 0; right: 0; height: 6px; cursor: n-resize; }
    .resize-handle.s { bottom: -3px; left: 0; right: 0; height: 6px; cursor: s-resize; }
    .resize-handle.e { right: -3px; top: 0; bottom: 0; width: 6px; cursor: e-resize; }
    .resize-handle.w { left: -3px; top: 0; bottom: 0; width: 6px; cursor: w-resize; }

    .resize-handle.nw { top: -3px; left: -3px; width: 6px; height: 6px; cursor: nw-resize; }
    .resize-handle.ne { top: -3px; right: -3px; width: 6px; height: 6px; cursor: ne-resize; }
    .resize-handle.sw { bottom: -3px; left: -3px; width: 6px; height: 6px; cursor: sw-resize; }
    .resize-handle.se { bottom: -3px; right: -3px; width: 6px; height: 6px; cursor: se-resize; }

  </style>
</head>
<body>

  <div class="taskbar" id="taskbar"></div>

  <script>
    let zIndexCounter = 10;
    let windowCounter = 0;

    function createWindow(type = "Explorer") {
      const win = document.createElement("div");
      win.classList.add("window");
      win.style.top = "100px";
      win.style.left = `${100 + windowCounter * 30}px`;
      win.style.width = "300px";
      win.style.height = "200px";
      win.style.zIndex = zIndexCounter++;

      win.innerHTML = `
        <div class="window-header">
          <div class="window-title">${type}</div>
          <div class="window-controls">
            <button class="minimize">–</button>
            <button class="maximize">□</button>
            <button class="close">×</button>
          </div>
        </div>
        <div class="window-content">
          <p>This is a ${type}-style window!</p>
        </div>
      `;

      // Add invisible resize handles
      const edges = ['n', 's', 'e', 'w', 'nw', 'ne', 'sw', 'se'];
      edges.forEach(edge => {
        const handle = document.createElement("div");
        handle.className = `resize-handle ${edge}`;
        win.appendChild(handle);
        handle.addEventListener("mousedown", e => startResize(e, win, edge));
      });

      document.body.appendChild(win);
      makeDraggable(win);
      setupControls(win, type);
    }

    function makeDraggable(win) {
      const header = win.querySelector('.window-header');
      let offsetX = 0, offsetY = 0, isDragging = false;

      header.addEventListener('mousedown', (e) => {
        isDragging = true;
        offsetX = e.clientX - win.offsetLeft;
        offsetY = e.clientY - win.offsetTop;
        win.style.zIndex = zIndexCounter++;
      });

      document.addEventListener('mousemove', (e) => {
        if (isDragging) {
          win.style.left = `${e.clientX - offsetX}px`;
          win.style.top = `${e.clientY - offsetY}px`;
        }
      });

      document.addEventListener('mouseup', () => isDragging = false);
    }

    function setupControls(win, type) {
      const minimizeBtn = win.querySelector('.minimize');
      const maximizeBtn = win.querySelector('.maximize');
      const closeBtn = win.querySelector('.close');

      minimizeBtn.onclick = () => {
        win.classList.add('minimized');
        const btn = document.createElement('button');
        btn.className = "taskbar-button";
        btn.textContent = type;
        btn.onclick = () => {
          win.classList.remove('minimized');
          btn.remove();
        };
        document.getElementById("taskbar").appendChild(btn);
      };

      maximizeBtn.onclick = () => {
        if (win.dataset.maximized === "true") {
          win.style.width = "300px";
          win.style.height = "200px";
          win.style.top = "100px";
          win.style.left = "100px";
          win.dataset.maximized = "false";
        } else {
          win.style.top = "0";
          win.style.left = "0";
          win.style.width = "100vw";
          win.style.height = "calc(100vh - 40px)";
          win.dataset.maximized = "true";
        }
      };

      closeBtn.onclick = () => win.remove();
    }

    function startResize(e, win, direction) {
      e.preventDefault();
      e.stopPropagation();
      const startX = e.clientX;
      const startY = e.clientY;
      const startWidth = parseInt(getComputedStyle(win).width);
      const startHeight = parseInt(getComputedStyle(win).height);
      const startLeft = win.offsetLeft;
      const startTop = win.offsetTop;

      function doResize(e) {
        if (direction.includes("e")) win.style.width = `${startWidth + (e.clientX - startX)}px`;
        if (direction.includes("s")) win.style.height = `${startHeight + (e.clientY - startY)}px`;
        if (direction.includes("w")) {
          const diff = e.clientX - startX;
          win.style.width = `${startWidth - diff}px`;
          win.style.left = `${startLeft + diff}px`;
        }
        if (direction.includes("n")) {
          const diff = e.clientY - startY;
          win.style.height = `${startHeight - diff}px`;
          win.style.top = `${startTop + diff}px`;
        }
      }

      function stopResize() {
        document.removeEventListener("mousemove", doResize);
        document.removeEventListener("mouseup", stopResize);
      }

      document.addEventListener("mousemove", doResize);
      document.addEventListener("mouseup", stopResize);
    }

    // Example
    createWindow("Explorer");
    createWindow("Sticky Note");
    createWindow("Word Doc");

  </script>
</body>
</html>
